<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AltiEDA – Professional Web EDA</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- Top toolbar -->
    <header id="toolbar">
      <div class="toolbar-left">
        <span class="logo">AltiEDA</span>
        <button id="btn-schematic" class="tool-btn active" data-mode="schematic">Schematic</button>
        <button id="btn-pcb" class="tool-btn" data-mode="pcb">PCB Layout</button>
        <button id="btn-3d" class="tool-btn" data-mode="3d">3D View</button>
        <button id="btn-sim" class="tool-btn" data-mode="simulation">Simulation</button>
      </div>
      <div class="toolbar-center">
        <button id="btn-wire" class="tool-btn" title="Wire Tool (W)">Wire</button>
        <button id="btn-via" class="tool-btn" title="Via Tool (V)">Via</button>
        <button id="btn-probe" class="tool-btn" title="Probe Tool (P)">Probe</button>
        <button id="btn-drc" class="tool-btn" title="Run DRC">DRC</button>
        <button id="btn-export" class="tool-btn" title="Export Gerbers">Export</button>
        <button id="btn-comp-editor" class="tool-btn" title="Component Editor" onclick="window.open('component-editor.html','_blank')">Comp Editor</button>
      </div>
      <div class="toolbar-right">
        <button id="btn-save" class="tool-btn">Save</button>
        <span id="status-bar">Ready</span>
      </div>
    </header>

    <!-- Main workspace -->
    <div id="workspace">
      <!-- Left component sidebar -->
      <aside id="sidebar-left">
        <div class="sidebar-header">Component Library</div>
        <input id="comp-search" type="text" placeholder="Search components…" />
        <div id="component-list"></div>
      </aside>

      <!-- Canvas area -->
      <main id="canvas-wrapper">
        <canvas id="main-canvas"></canvas>
        <!-- 3D container (hidden by default) -->
        <div id="three-container" style="display:none;width:100%;height:100%;"></div>
        <!-- Probe tooltip -->
        <div id="probe-tooltip" class="tooltip hidden"></div>
        <!-- DRC panel -->
        <div id="drc-panel" class="collapsible-panel hidden">
          <div class="panel-header">DRC Violations <button id="btn-close-drc">✕</button></div>
          <ul id="drc-list"></ul>
        </div>
        <!-- Oscilloscope window -->
        <div id="oscilloscope-panel" class="collapsible-panel hidden">
          <div class="panel-header">Oscilloscope <button id="btn-close-osc">✕</button></div>
          <canvas id="osc-canvas" width="600" height="200"></canvas>
        </div>
      </main>

      <!-- Right contextual resource panel -->
      <aside id="sidebar-right" class="hidden">
        <div class="sidebar-header">
          Component Info
          <button id="btn-close-info">✕</button>
        </div>
        <!-- Tabs -->
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="specs">Specs</button>
          <button class="tab-btn" data-tab="stackoverflow">StackOverflow</button>
          <button class="tab-btn" data-tab="github">GitHub Issues</button>
        </div>
        <div id="tab-specs" class="tab-content"></div>
        <div id="tab-stackoverflow" class="tab-content hidden"></div>
        <div id="tab-github" class="tab-content hidden"></div>
      </aside>
    </div>
  </div>

  <!-- Layer manager modal -->
  <div id="layer-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">Layer Stack-up Manager <button id="btn-close-layer">✕</button></div>
      <div id="layer-stackup-ui"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
